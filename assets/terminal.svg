<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <style>
    .bg { fill: #0d1117; }
    .bar { fill: #161b22; }
    .t { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 15px; fill: #c9d1d9; }
    .p { fill: #3fb950; }
    .k { fill: #a371f7; }
    .s { fill: #58a6ff; }
    .m { fill: #8b949e; }
    .y { fill: #e3b341; }
    .cover { fill: #0d1117; }
    .line { opacity: 0; animation: show .01s forwards; }
    .type { animation: type 1.1s steps(40) forwards; }
    .cursor { fill: #58a6ff; animation: blink 1s step-end infinite; opacity: 0; }
    @keyframes show { to { opacity: 1; } }
    @keyframes type { from { transform: translateX(0); } to { transform: translateX(720px); } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    .l1 { animation-delay: .2s; }  .c1 { animation-delay: .3s; }
    .l2 { animation-delay: 1.5s; }
    .l3 { animation-delay: 1.8s; }
    .l4 { animation-delay: 2.1s; }
    .l5 { animation-delay: 2.4s; }
    .l6 { animation-delay: 2.9s; } .c6 { animation-delay: 3.0s; }
    .l7 { animation-delay: 4.2s; }
    .cur { animation-delay: 4.3s; }
  </style>

  <rect class="bg" width="800" height="300" rx="14"/>
  <rect class="bar" width="800" height="36" rx="14"/>
  <rect class="bar" y="22" width="800" height="14"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="400" y="23" text-anchor="middle" class="t m" font-size="13">luis@github: ~</text>

  <!-- comando 1 -->
  <g class="line l1">
    <text x="24" y="72" class="t"><tspan class="p">➜</tspan> <tspan class="s">~</tspan> whoami --verbose</text>
    <rect class="cover type c1" x="70" y="56" width="720" height="22"/>
  </g>

  <!-- salida -->
  <g class="line l2"><text x="24" y="104" class="t"><tspan class="k">name</tspan>     <tspan class="m">→</tspan> Luis Miguel</text></g>
  <g class="line l3"><text x="24" y="128" class="t"><tspan class="k">role</tspan>     <tspan class="m">→</tspan> Frontend Developer</text></g>
  <g class="line l4"><text x="24" y="152" class="t"><tspan class="k">stack</tspan>    <tspan class="m">→</tspan> <tspan class="s">React</tspan> · <tspan class="s">TypeScript</tspan> · <tspan class="s">Next.js</tspan> · <tspan class="s">GraphQL</tspan></text></g>
  <g class="line l5"><text x="24" y="176" class="t"><tspan class="k">focus</tspan>    <tspan class="m">→</tspan> UI pixel-perfect, design systems, DX</text></g>

  <!-- comando 2 -->
  <g class="line l6">
    <text x="24" y="218" class="t"><tspan class="p">➜</tspan> <tspan class="s">~</tspan> echo $STATUS</text>
    <rect class="cover type c6" x="70" y="202" width="720" height="22"/>
  </g>
  <g class="line l7"><text x="24" y="246" class="t y">✨ Siempre construyendo algo nuevo. ¡Bienvenido!</text></g>

  <!-- prompt final -->
  <g class="line l7">
    <text x="24" y="280" class="t"><tspan class="p">➜</tspan> <tspan class="s">~</tspan></text>
  </g>
  <rect class="cursor cur" x="58" y="266" width="9" height="18"/>
</svg>
